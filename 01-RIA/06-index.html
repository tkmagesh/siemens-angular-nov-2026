<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Calculator</title>
    <script src="jquery-4.1.0.js"></script>
    <style>
        .field{
            margin: 10px;
        }
        label{
            display: inline-block;
            width: 100px;
        }
        td{
            padding: 5px;
        }
    </style>
    <script>
        class SalaryCalculatorModel{
            _data = {
                basic: 0,
                hra: 0,
                da: 0,
                tax: 0,
                salary: 0
            }

            _changeHandlers = {
                basic: null,
                hra: null,
                da: null,
                tax: null,
                salary: null,
            }

            set(key, value){
                this._data[key] = value;
                if(typeof this._changeHandlers[key] === "function"){
                    this._changeHandlers[key]();
                }
            }

            get(key){
                return this._data[key];
            }

            onChange(key, handler){
                this._changeHandlers[key] = handler;
            }

            calculateSalary(){
                var grossSalary = this.get("basic") + this.get("hra") + this.get("da");
                var taxAmount = (grossSalary * this.get("tax")) / 100;
                this.set("salary", grossSalary - taxAmount);
            }

        }

        $(document).ready(function(){
            window.model = new SalaryCalculatorModel();

            $("#txtBasic").change(function(){
                model.set("basic", parseFloat($(this).val()));
            });

            $("#txtHra").change(function(){
                model.set("hra", parseFloat($(this).val()));
            });

            $("#txtDa").change(function(){
                model.set("da", parseFloat($(this).val()));
            });

            $("#rangeTax").change(function(){
                model.set("tax", parseFloat($(this).val()));
            });

            $("#btnCalculate").click(function(){
                model.calculateSalary();
            });

            model.onChange("basic", function(){
                $("#tdBasic").text(model.get("basic").toFixed(2));
            });
            model.onChange("hra", function(){
                $("#tdHra").text(model.get("hra").toFixed(2));
            });
            model.onChange("da", function(){
                $("#tdDa").text(model.get("da").toFixed(2));
            });
            model.onChange("tax", function(){
                $("#tdTax").text(model.get("tax").toFixed(2));
            });
            model.onChange("salary", function(){
                $("#tdSalary").text(model.get("salary").toFixed(2));
            });

            
        });
    </script>
</head>
<body>
    <h1>Salary Calculator - V6.0</h1>
    <hr>
    <div>
        <div class="field">
            <label for="">Basic :</label>
            <input type="number" name="" id="txtBasic">
        </div>
        <div class="field">
            <label for="">HRA :</label>
            <input type="number" name="" id="txtHra">
        </div>
        <div class="field">
            <label for="">DA :</label>
            <input type="number" name="" id="txtDa">
        </div>
        <div class="field">
            <label for="">Tax :</label>
            <input type="range" name="" id="rangeTax" min="0" max="30" value="0">
        </div>
        <div class="field">
            <button id="btnCalculate">Calculate</button>
        </div>
        <div class="field">
            <table>
                <tr>
                    <td>Basic</td>
                    <td>HRA</td>
                    <td>DA</td>
                    <td>Tax</td>
                    <td>Gross Salary</td>
                </tr>
                <tr>
                    <td id="tdBasic">0</td>
                    <td id="tdHra">0</td>
                    <td id="tdDa">0</td>
                    <td id="tdTax">0</td>
                    <td id="tdSalary">0</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
