<html lang="en">
<head>

    <title>State Manager</title>
    <script src="state-manager.js"></script>

<body>
    <!-- 
    // counter reducer function to increment and decrement a value
    function counterReducer(currentState = 0, action){
        if (action.type === 'INCREMENT') return currentState + 1;
        if (action.type === 'DECREMENT') return currentState - 1;
        return currentState
    }

    // create a store instance with the counter reducer
    let store = StateManager.createStore(counterReducer)

    // subscribe to the store for any state changes
    store.subscribe(() => { console.log(`current state : ${store.getState()}`) })

    // dispatch actions ('INCREMENT' / 'DECREMENT')
    store.dispatch({ type : 'INCREMENT' })
    .
    .
    store.dispatch({ type : 'DECREMENT' })
    .
    .
    
    -->
</body>
